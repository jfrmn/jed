[Font]
editor = {
	#name = "Geist Mono",
	name = "Fira Code",
	size = 12}
	
ui = {
	#name = "Geist",
	name = "Fira Sans",
	size = 12}
	


[[Tools]]
name = "build project"
command = 'pwsh.exe -f .\build.ps1 %0 %1 %2'
open-console = "on-start"
diagnostics = {
	regex = '^([A-Z]:[\w\.\\-]+)\((\d+)\): (\w+)(?: C\d+)?: .*$',
	group-file = 1,
	group-line = 2,
	group-color = 3,
	color-mapping = {
		error   = [255, 0, 0],
		warning = [255, 255, 0],
		note    = [0, 255, 0]}}
parameters = [
	{
		type = "enum",
		name = "profile",
		default = "debug",
		values = [
			"debug",
			"stable",
			"release"
		]
	},
	{
		type = "bool",
		name = "reconfigure",
		default = false,
		if-true = "-reconfigure",
		if-false = ""
	},
	{
		type = "bool",
		name = "run",
		default = true,
		if-true = "-runDetached",
		if-false = ""
	}
]

